name: Verify

"on":
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker

      - name: Cache pinned build archives
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ runner.temp }}/asma-package-cache
          key: asma-package-cache-${{ hashFiles('runtime/synthetic-packages.json', 'runtime/source-adapter-python.json') }}
          restore-keys: |
            asma-package-cache-

      - name: Build synthetic runtime image
        run: |
          set -euo pipefail
          ASMA_PACKAGE_CACHE="${RUNNER_TEMP}/asma-package-cache"
          mkdir -p "$ASMA_PACKAGE_CACHE"
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if python3 tools/build_synthetic_runtime.py --source-cache "$ASMA_PACKAGE_CACHE"; then
              break
            fi
            echo "Synthetic build attempt ${attempt} failed" >&2
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            rm -rf "$ASMA_PACKAGE_CACHE"
            mkdir -p "$ASMA_PACKAGE_CACHE"
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
          docker image inspect asma-synthetic:4.4.3 --format '{{.Id}}' | tee synthetic-image-id.txt

      - name: Build source-adapter runtime image
        id: adapter_build
        run: |
          set -euo pipefail
          ASMA_PACKAGE_CACHE="${RUNNER_TEMP}/asma-package-cache"
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if json=$(python3 tools/build_source_adapter_runtime.py --accept-rebuilt-base --source-cache "$ASMA_PACKAGE_CACHE"); then
              break
            fi
            echo "Source-adapter build attempt ${attempt} failed" >&2
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            rm -rf "$ASMA_PACKAGE_CACHE"
            mkdir -p "$ASMA_PACKAGE_CACHE"
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
          echo "$json"
          image_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["image_id"])' <<<"$json")
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "$image_id" | tee adapter-image-id.txt

      - name: Run offline checks in pinned images
        id: runtime_checks
        env:
          ADAPTER_IMAGE: ${{ steps.adapter_build.outputs.image_id }}
        run: |
          set -euo pipefail
          set -o pipefail
          asma_offline_run() {
            docker run --rm \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --user "$(id -u):$(id -g)" \
              --security-opt=no-new-privileges \
              --ulimit=core=0 \
              --pids-limit=256 \
              --memory=8g \
              --memory-swap=8g \
              --cpus=2 \
              --tmpfs=/tmp:rw,noexec,nosuid,size=256m \
              --env HOME=/tmp \
              --env GIT_CONFIG_COUNT=1 \
              --env GIT_CONFIG_KEY_0=safe.directory \
              --env GIT_CONFIG_VALUE_0=/work \
              --volume "${GITHUB_WORKSPACE}:/work:ro" \
              --workdir /work \
              --env R_HISTFILE=/dev/null \
              --env XDG_CACHE_HOME=/tmp/asma-cache \
              --env R_USER_CACHE_DIR=/tmp/asma-cache \
              "$@"
          }

          log=$(asma_offline_run "$ADAPTER_IMAGE" /opt/python/bin/python3 -I -B tools/validate.py \
            2>&1 | tee validate.log)
          echo "$log"
          grep -q '^PASS:' validate.log

          log=$(asma_offline_run "$ADAPTER_IMAGE" /opt/python/bin/python3 -I -B -m unittest discover -s tests -v 2>&1 | tee python-suite.log)
          echo "$log"
          grep -E '^Ran [0-9]+ tests' python-suite.log | grep -Fq 'Ran 207 tests'

          log=$(asma_offline_run "$ADAPTER_IMAGE" /opt/python/bin/python3 -I -B -m unittest discover -s tests -p test_source_data_adapter.py -v 2>&1 | tee adapter-tests.log)
          echo "$log"
          grep -E '^Ran [0-9]+ tests' adapter-tests.log | grep -Fq 'Ran 30 tests'

          synthetic_id=$(docker image inspect asma-synthetic:4.4.3 --format '{{.Id}}')
          log=$(asma_offline_run --env "ASMA_RUNTIME_IMAGE_ID=$synthetic_id" "$synthetic_id" \
            Rscript --vanilla tools/run_synthetic_pipeline.R --tests 2>&1 | tee r-assertions.log)
          echo "$log"
          total=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["assertions"]["total"])' <<<"$log")
          echo "R assertion total: $total"
          test "$total" = "179"

      - name: Execution controls (40 technical checks)
        id: execution_controls
        run: |
          set -euo pipefail
          image="${{ steps.adapter_build.outputs.image_id }}"
          python3 tools/probe_execution_conditions.py --runtime-image-id "$image" | tee execution-controls.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("execution-controls.json").read_text())
          checks = data["checks"]
          excluded = []
          if os.environ.get("CI_EXCLUDED_CONTROLS"):
              excluded = [item.strip() for item in os.environ["CI_EXCLUDED_CONTROLS"].split(",") if item.strip()]

          lines = [
              "## Execution controls",
              "",
              f"Technical status: **{data['technical_checks_status']}**",
              f"Runtime image: `{data['runtime_image_id']}`",
              "",
              "| Control | Status |",
              "| --- | --- |",
          ]
          for name in sorted(checks):
              if name in excluded:
                  lines.append(f"| {name} | EXCLUDED (CI) |")
              else:
                  lines.append(f"| {name} | {checks[name]['status']} |")
          if excluded:
              lines.extend(["", "### Excluded on this runner", ""])
              for item in excluded:
                  lines.append(f"- {item}")
          summary = "\n".join(lines) + "\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          print(summary)
          if data["technical_checks_status"] != "PASS":
              raise SystemExit("Execution controls did not pass")
          PY
