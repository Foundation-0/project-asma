name: Cross-arch synthetic equivalence

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd64-synthetic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker

      - name: Cache pinned build archives
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ runner.temp }}/asma-package-cache
          key: asma-package-cache-${{ hashFiles('runtime/synthetic-packages.json', 'runtime/synthetic-packages-arm64.json') }}
          restore-keys: |
            asma-package-cache-

      - name: Build and record linux/amd64 synthetic aggregates
        run: |
          set -euo pipefail
          ASMA_PACKAGE_CACHE="${RUNNER_TEMP}/asma-package-cache"
          mkdir -p "$ASMA_PACKAGE_CACHE"
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if python3 tools/run_cross_arch_equivalence.py \
              --platform linux/amd64 \
              --source-cache "$ASMA_PACKAGE_CACHE" \
              --write-record synthetic-amd64-record.json; then
              break
            fi
            echo "Synthetic build attempt ${attempt} failed" >&2
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done

      - name: Upload amd64 synthetic record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-amd64-record
          path: synthetic-amd64-record.json

  arm64-synthetic-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker

      - name: Cache pinned build archives
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ runner.temp }}/asma-package-cache
          key: asma-package-cache-${{ hashFiles('runtime/synthetic-packages.json', 'runtime/synthetic-packages-arm64.json') }}
          restore-keys: |
            asma-package-cache-

      - name: Build and record linux/arm64 synthetic aggregates (native runner)
        run: |
          set -euo pipefail
          ASMA_PACKAGE_CACHE="${RUNNER_TEMP}/asma-package-cache"
          mkdir -p "$ASMA_PACKAGE_CACHE"
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if python3 tools/run_cross_arch_equivalence.py \
              --platform linux/arm64 \
              --source-cache "$ASMA_PACKAGE_CACHE" \
              --write-record synthetic-arm64-record.json; then
              break
            fi
            echo "Synthetic build attempt ${attempt} failed" >&2
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done
          docker image inspect asma-synthetic:4.4.3-arm64 --format 'native_arch={{.Architecture}} Id={{.Id}}'

      - name: Upload arm64 synthetic record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-arm64-record
          path: synthetic-arm64-record.json

  cross-arch-equivalence:
    runs-on: ubuntu-24.04
    needs: [amd64-synthetic, arm64-synthetic-native]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download synthetic records
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: synthetic-*-record
          path: cross-arch-input
          merge-multiple: true

      - name: Compare aggregates and write pass record
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/run_cross_arch_equivalence.py \
            --amd64-record cross-arch-input/synthetic-amd64-record.json \
            --arm64-record cross-arch-input/synthetic-arm64-record.json \
            --git-sha "${HEAD_SHA}" \
            --write-pass pilot001-cross-arch-equivalence-pass.json \
            | tee cross-arch-pass.json

      - name: Upload equivalence pass record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot001-cross-arch-equivalence-pass
          path: pilot001-cross-arch-equivalence-pass.json
