name: Lean

"on":
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/lean.yml"
  push:
    branches:
      - main
    paths:
      - "formal/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install elan (v4.2.4, pinned script hash)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh -o elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build formal modules with the pinned toolchain
        working-directory: formal
        run: |
          set -euo pipefail
          lean --version | tee lean-version.txt
          grep -q "version 4.35.0" lean-version.txt
          lake build
          lake env lean AsmaIdentifiabilityProofs.lean | tee axioms.txt
          tail -n +3 axioms-lean-4.35.0.txt | diff - axioms.txt
          if grep -nE '\b(sorry|admit|native_decide)\b|^axiom ' AsmaIdentifiabilityProofs.lean FloatingSelectionAndCrushingGate.lean | grep -v 'no sorry'; then
            echo "forbidden token in Lean source" >&2
            exit 1
          fi
